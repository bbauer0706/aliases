name: CI and release

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest

  release:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run cz bump --yes
          status=$?
          set -e

          if [[ $status -eq 3 ]]; then
            echo "No releasable commits found."
            exit 0
          elif [[ $status -ne 0 ]]; then
            exit "$status"
          fi

          tag=$(git describe --tags --abbrev=0)

          # Push the tag directly — tags are not subject to branch-protection rules
          git push origin "$tag"

          # Open a PR for the version-bump commit so it lands in main via the
          # required PR workflow, then enable auto-merge so it merges once CI passes
          release_branch="release/${tag}"
          git checkout -b "$release_branch"
          git push origin "$release_branch"
          gh pr create \
            --title "bump: version ${tag}" \
            --body "Automated version bump to ${tag}." \
            --base main \
            --head "$release_branch"
          gh pr merge "$release_branch" --auto --squash

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.bump.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --verify-tag --generate-notes